# One command starts both databases (reads DB_PASSWORD from your .env.local):
#     docker compose --env-file .env.local up -d
#   MySQL 8  -> localhost:3306  (schema, sample data, procedures, triggers, views loaded automatically)
#   Qdrant   -> localhost:6333  (vector database; dashboard at http://localhost:6333/dashboard)
# The SQL init scripts run only the FIRST time (when the mysql_data volume is empty).
# To reload from scratch:  docker compose down -v && docker compose --env-file .env.local up -d
services:
  mysql:
    image: mysql:8.0
    container_name: researchlens-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env.local and run with --env-file .env.local}
    command: ["--log-bin-trust-function-creators=1"]
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./sql/02_sample_data_and_queries.sql:/docker-entrypoint-initdb.d/02_sample_data_and_queries.sql:ro
      - ./sql/03_member1_advanced.sql:/docker-entrypoint-initdb.d/03_member1_advanced.sql:ro
      - ./sql/04_member2_advanced.sql:/docker-entrypoint-initdb.d/04_member2_advanced.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      retries: 20

  qdrant:
    image: qdrant/qdrant:v1.20.0   # same version the project was tested with
    container_name: researchlens-qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  mysql_data:
  qdrant_data:
